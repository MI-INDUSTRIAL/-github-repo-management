name: Validate Repository Requests

on:
  pull_request:
    branches:
      - main
    paths:
      - "requests/repository-requests.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Repository Registry
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate repository requests
        run: |
          python scripts/validate_request.py requests/repository-requests.yml
