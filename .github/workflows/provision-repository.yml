name: Provision Repository

on:
  push:
    branches:
      - main
    paths:
      - "requests/repository-requests.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  provision:
    name: Provision Repositories
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate repository registry
        run: |
          python scripts/validate_request.py requests/repository-requests.yml

      - name: Provision repositories
        env:
          GITHUB_ORG: MI-INDUSTRIAL
          ORG_ADMIN_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
        run: |
          python scripts/create_repo.py requests/repository-requests.yml
